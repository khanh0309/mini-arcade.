<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sliding Puzzle</title><link rel="stylesheet" href="../../assets/game-shell.css"><style>.puzzle-wrap{max-width:620px;margin:auto}.puzzle{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;aspect-ratio:1;background:#0a1222;padding:8px;border-radius:18px}.tile{border:1px solid #364a76;background:linear-gradient(145deg,#1e2d4f,#15213a);color:white;border-radius:14px;font-size:clamp(22px,7vw,50px);font-weight:900;cursor:pointer;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}.tile.empty{visibility:hidden}.puzzle-actions{display:flex;justify-content:center;gap:8px;margin-top:12px}</style></head>
<body><div class="game-page"><div class="topbar"><div class="nav-actions"><a class="back" href="../../">← Arcade</a><button class="small-btn sound-btn" data-sound-toggle>🔊 Âm thanh</button><span class="coin-chip">🪙 <span data-coin-balance>0</span></span><button class="player-chip" data-player-chip>👤 Player</button></div><div class="title"><h1>🧩 Sliding Puzzle</h1><p>Sắp 1 → 15 theo thứ tự, ô trống ở cuối.</p></div><div class="stats"><div class="stat">Bước<strong id="moves">0</strong></div><div class="stat">Cấp<strong id="level">1</strong></div><div class="stat">Điểm cao<strong id="best">—</strong></div></div></div>
<div class="stage"><div class="puzzle-wrap"><div id="puzzle" class="puzzle"></div><div class="puzzle-actions"><button class="small-btn" id="shuffle">🔀 Xáo lại</button><button class="small-btn" id="hint">💡 Cách chơi</button></div></div><div class="overlay hidden" id="overlay"><div class="overlay-card"><div class="emoji">🎉</div><h2>Hoàn thành!</h2><p id="winText"></p><button class="primary" id="again">Chơi ván mới</button></div></div></div>
<div class="controls">Bấm ô cạnh ô trống để di chuyển. Hoàn thành càng nhiều ván thì cấp độ xáo càng khó.</div></div><script src="../../assets/audio.js"></script><script src="../../assets/economy.js"></script><script src="../../assets/leaderboard.js"></script><script src="./game.js"></script></body></html>
