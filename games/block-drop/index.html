<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Block Drop</title><link rel="stylesheet" href="../../assets/game-shell.css"></head>
<body><div class="game-page"><div class="topbar"><div class="nav-actions"><a class="back" href="../../">← Arcade</a><button class="small-btn sound-btn" data-sound-toggle>🔊 Âm thanh</button><span class="coin-chip">🪙 <span data-coin-balance>0</span></span><button class="player-chip" data-player-chip>👤 Player</button></div><div class="title"><h1>🧱 Block Drop</h1><p>Xếp khối, xóa hàng và đừng để chạm nóc.</p></div><div class="stats"><div class="stat">Điểm<strong id="score">0</strong></div><div class="stat">Dòng<strong id="lines">0</strong></div><div class="stat">Kỷ lục<strong id="best">0</strong></div></div></div>
<div class="stage" style="max-width:620px;margin:auto"><canvas id="game" width="360" height="600"></canvas><div class="overlay" id="overlay"><div class="overlay-card"><div class="emoji">🧱</div><h2 id="ovTitle">Block Drop</h2><p id="ovText">← → di chuyển, ↑ xoay, ↓ hạ nhanh, Space thả xuống.</p><button class="primary" id="startBtn">Bắt đầu</button></div></div></div>
<div class="controls"><span><kbd>←</kbd><kbd>→</kbd> di chuyển</span><span><kbd>↑</kbd> xoay</span><span><kbd>↓</kbd> hạ nhanh</span><span><kbd>Space</kbd> thả</span></div><div class="touch-row dpad" aria-label="Điều khiển khối"><button class="dpad-up" data-act="rotate" aria-label="Xoay">↻</button><button class="dpad-left" data-act="left" aria-label="Trái">←</button><span class="dpad-center" aria-hidden="true"></span><button class="dpad-right" data-act="right" aria-label="Phải">→</button><button class="dpad-down" data-act="down" aria-label="Hạ nhanh">↓</button></div><div class="touch-actions"><button data-act="drop">⤓ Thả xuống</button></div></div><script src="../../assets/audio.js"></script><script src="../../assets/economy.js"></script><script src="../../assets/leaderboard.js"></script><script src="./game.js"></script></body></html>
