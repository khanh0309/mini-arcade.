<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Snake</title><link rel="stylesheet" href="../../assets/game-shell.css"></head>
<body><div class="game-page"><div class="topbar"><div class="nav-actions"><a class="back" href="../../">← Arcade</a><button class="small-btn sound-btn" data-sound-toggle>🔊 Âm thanh</button><button class="small-btn skin-btn" data-skin-game="snake">🎨 Skin</button><span class="coin-chip">🪙 <span data-coin-balance>0</span></span><button class="player-chip" data-player-chip>👤 Player</button></div><div class="title"><h1>🐍 Neon Snake</h1><p>Ăn mồi, dài hơn; rắn tăng tốc từ từ theo thời gian và điểm số.</p></div><div class="stats"><div class="stat">Điểm<strong id="score">0</strong></div><div class="stat">Kỷ lục<strong id="best">0</strong></div></div></div>
