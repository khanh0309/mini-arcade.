<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcade Football 1v1</title><link rel="stylesheet" href="../../assets/game-shell.css"><link rel="stylesheet" href="./football.css"></head>
<body><div class="game-page football-page">
  <div class="topbar">
    <div class="nav-actions"><a class="back" href="../../">← Arcade</a><button class="small-btn sound-btn" data-sound-toggle>🔊 Âm thanh</button><button class="small-btn skin-btn" data-skin-game="arcade-football">🎨 Skin</button><span class="coin-chip">🪙 <span data-coin-balance>0</span></span><button class="player-chip" data-player-chip>👤 Player</button></div>
    <div class="title"><h1>⚽ Arcade Football</h1><p>1v1 • Ai ghi 3 bàn trước thì thắng.</p></div>
    <div class="stats"><div class="stat">Tỷ số<strong id="scoreText">0 - 0</strong></div><div class="stat">Chế độ<strong id="modeText">Menu</strong></div><div class="stat">Mục tiêu<strong>3 bàn</strong></div></div>
  </div>

  <div class="stage football-stage"><canvas id="game" width="960" height="540"></canvas>
    <div class="football-overlay" id="footballOverlay"><div class="football-panel" id="footballPanel"></div></div>
    <div class="countdown-badge hidden" id="countdownBadge">3</div>
    <div class="goal-badge hidden" id="goalBadge">GOAL!</div>
  </div>

  <div class="controls" id="keyboardHelp"><span><kbd>A</kbd><kbd>D</kbd> chạy</span><span><kbd>W</kbd> nhảy</span><span><kbd>F</kbd>/<kbd>Space</kbd> sút</span><span>Local P2: <kbd>←</kbd><kbd>→</kbd> <kbd>↑</kbd> <kbd>Enter</kbd></span></div>
  <div class="touch-wrap" id="touchWrap">
    <div class="touch-pad" data-pad="p1"><b id="touchP1Label">Bạn</b><button data-touch="left">⬅</button><button data-touch="jump">⬆</button><button data-touch="right">➡</button><button class="kick" data-touch="kick">⚽ Sút</button></div>
    <div class="touch-pad hidden" data-pad="p2"><b>P2</b><button data-touch="left">⬅</button><button data-touch="jump">⬆</button><button data-touch="right">➡</button><button class="kick" data-touch="kick">⚽ Sút</button></div>
  </div>
  <div class="game-help-note">Online cần realtime server. Practice vs CPU và Local 2 Players vẫn chơi được ngay cả khi server chưa cấu hình.</div>
</div>
<script src="../../assets/audio.js"></script><script src="../../assets/economy.js"></script><script src="../../assets/leaderboard.js"></script><script src="../../assets/skins.js"></script><script src="./config.js"></script><script src="./physics.js"></script><script src="./game.js"></script></body></html>
